name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project app/yapd.xcodeproj -configuration Release -quiet build
      # The app's own checks, which only a Mac's swiftc builds.
      - uses: oven-sh/setup-bun@v2
      - run: bun test src/App.test.ts
